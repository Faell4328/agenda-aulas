<mat-dialog-content>
    <h3>{{title}}</h3>
    <p *ngIf="this.message">{{message}}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <div>
    <button matButton mat-dialog-close>Não</button>
    <button matButton [mat-dialog-close]="true" cdkFocusInitial>{{button_text}}</button>
  </div>
</mat-dialog-actions>
