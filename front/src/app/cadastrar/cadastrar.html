<div id="container">
    <form #frm="ngForm">
        <h3>Cadastro</h3>
        <hr />
        <mat-form-field class="input-form">
            <mat-label>Nome</mat-label>
            <input [(ngModel)]="name" type="name" name='name' matInput>
        </mat-form-field>
        <mat-form-field>
            <mat-label>Função</mat-label>
            <mat-select>
                <mat-option value="teacher">Professor</mat-option>
                <mat-option value="student">Estudante</mat-option>
            </mat-select>
        </mat-form-field>
        <mat-form-field class="input-form">
            <mat-label>Email</mat-label>
            <input [(ngModel)]="email" type="email" name='email' matInput>
        </mat-form-field>
        <mat-form-field class="input-form">
            <mat-label>Senha</mat-label>
            <input [(ngModel)]="password" matInput [type]="hide() ? 'password' : 'text'" name="password" />
            <button
                matIconButton
                matSuffix
                (click)="clickEvent($event)"
                [attr.aria-label]="'Hide password'"
                [attr.aria-pressed]="hide()"
                style="border: 0px"
            >
                <mat-icon>{{hide() ? 'visibility_off' : 'visibility'}}</mat-icon>
            </button>
        </mat-form-field>
        <button id="btn-submit" (click)="formSubmit()" mat-raised-button color="primary">Logar</button>
    </form>
</div>
